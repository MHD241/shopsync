async function handleBarcode(code){if(!code?.trim())return say('Enter or scan a barcode.',true);let b=code.trim();pendingScan={...(pendingScan||{}),barcode:b,name:''};go('scanned');let input=$('scanName');if(input)input.placeholder='Looking up product…';try{let response=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(b)+'.json?fields=product_name,brands,quantity,image_url',{signal:AbortSignal.timeout(7000)});if(!response.ok)throw Error('Lookup unavailable');let data=await response.json();if(data.status===1&&data.product){let x=data.product;pendingScan.name=[x.brands,x.product_name,x.quantity].filter(Boolean).join(' ').trim();if($('scanName'))$('scanName').value=pendingScan.name;if($('scanImage')&&x.image_url)$('scanImage').value=x.image_url;}else if($('scanName'))$('scanName').placeholder='Not in database — enter name on package';}catch(e){if($('scanName'))$('scanName').placeholder='Enter name on package (lookup unavailable)';}}
function openShelfCamera(){let f=$('shelfPhoto');if(f)f.click();}function focusPrice(){let f=$('scanPrice');if(f)f.focus();}function showShelfPhoto(e){let f=e.target.files?.[0],p=$('shelfPreview');if(!f||!p)return;let url=window.URL.createObjectURL(f);p.innerHTML='<img alt="Shelf label photograph" style="max-width:100%;max-height:240px;object-fit:contain;border-radius:10px;margin:8px 0" src="'+url+'"><p class="footnote">Read the price shown in your photo, then type it below.</p>';}
async function completeScan(e){e.preventDefault();if(!selected)return say('Select a list first.',true);let item=items.find(i=>i.id===$('matchItem').value);if(!item)return say('Select an item.',true);let name=$('scanName').value.trim(),price_pence=Math.round(Number($('scanPrice').value)*100),image_url=$('scanImage').value.trim()||null,message=$('scanMessage').value.trim(),barcode=pendingScan?.barcode||null;if(!name||!Number.isFinite(price_pence)||price_pence<0)return say('Enter a valid product and price.',true);if(name.toLowerCase()===item.name.toLowerCase()){let {error:e2}=await db.from('shopping_items').update({checked:true,price_pence,barcode,image_url:image_url||item.image_url}).eq('id',item.id);if(e2)return say(e2.message,true);pendingScan=null;await loadItems();go('list');say('Item scanned and added to your total!');}else{let {error:e2}=await db.from('substitution_requests').insert({list_id:selected.id,item_id:item.id,requested_by:user.id,name,price_pence,image_url,barcode,message});if(e2)return say(e2.message,true);pendingScan=null;await loadItems();go('requests');say('Substitution request sent to Mum.');}}async function decide(id,status){let {error:e}=await db.from('substitution_requests').update({status}).eq('id',id).eq('status','pending');if(e)return say(e.message,true);await loadItems();render();}async function confirmApproved(id){let r=requests.find(x=>x.id===id);if(!r||r.status!=='approved')return;let {error:e}=await db.from('shopping_items').update({checked:true,name:r.name,price_pence:r.price_pence,barcode:r.barcode,image_url:r.image_url}).eq('id',r.item_id);if(e)return say(e.message,true);await loadItems();go('list');say('Approved replacement added to trolley.');}let channel=db.channel('shopsync-live').on('postgres_changes',{event:'*',schema:'public',table:'shopping_items'},async()=>{if(selected){await loadItems();render();}}).on('postgres_changes',{event:'*',schema:'public',table:'substitution_requests'},async()=>{if(selected){await loadItems();render();}}).on('postgres_changes',{event:'*',schema:'public',table:'shopping_lists'},async()=>{await loadLists();}).subscribe();db.auth.onAuthStateChange(async(_event,session)=>{let previous=user?.id;user=session?.user||null;if(user&&user.id!==previous){await loadLists();}if(!user){selected=null;items=[];lists=[];requests=[];view='lists';render();}});db.auth.getSession().then(({data})=>{user=data.session?.user||null;if(user)loadLists();else render();});
}
})();
